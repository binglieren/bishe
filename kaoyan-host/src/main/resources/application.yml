server:
  port: 8088
  tomcat:
    max-http-form-post-size: 500MB
    uri-encoding: UTF-8

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/kaoyan
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  mandatory-file-encoding: UTF-8

# JWT 配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时（毫秒）

# LLM API 配置（系统默认；管理员可在 admin 后台「API 配置」页按 stage 独立配置）
#
# 解析链（从高到低）：
#   ① 用户 AiConfig（仅 chat 阶段生效，其他 stage 严格隔离）
#   ② SystemApiConfig（DB）— 管理员后台维护，5 个 stage 各自独立
#   ③ 本文件 — 仅作为数据库还没有该 stage 行时的首次播种 + 兜底
#
# ⚠️ 修改本文件后须让 DB 重新播种：
#   ① 进 admin 后台「API 配置」页手动改对应 stage；或
#   ② 执行 DELETE FROM system_api_config; 然后重启后端
llm:
  # ── ① chat：DeepSeek-V3 官方模型 ──
  # 适用：AI 答疑文本路径、对话标题生成、题目知识点打标
  api-key: ${LLM_API_KEY}
  api-url: ${LLM_API_URL:https://api.deepseek.com}
  model: ${LLM_MODEL:deepseek-v4-pro}

  # ── ② multimodal：Qwen-VL (DashScope OpenAI 兼容) ──
  # 支持图片输入，用于拍照搜题、题目结构化
  multimodal-model: ${LLM_MULTIMODAL_MODEL:qwen-vl-ocr}
  multimodal-api-url: ${LLM_MULTIMODAL_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  multimodal-api-key: ${LLM_MULTIMODAL_API_KEY}

  # ── ③ embedding：通义千问 text-embedding-v4 (DashScope OpenAI 兼容) ──
  # 支持 dimensions = 64/128/256/512/768/1024/1536/2048；DB 列固定 1536，自动请求该维度
  embedding-model: ${LLM_EMBEDDING_MODEL:text-embedding-v4}
  embedding-api-url: ${LLM_EMBEDDING_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  embedding-api-key: ${LLM_EMBEDDING_API_KEY}

  # ── ④ audio (STT)：千问 Qwen-Omni (DashScope OpenAI 兼容) ──
  # 走 /chat/completions + content[input_audio]，base64 直传，不需要文件 URL
  # 候选模型：qwen3-omni-flash / qwen-omni-turbo / qwen3-omni-30b-a3b-instruct
  audio-model: ${LLM_AUDIO_MODEL:qwen3-omni-flash}
  audio-api-url: ${LLM_AUDIO_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  audio-api-key: ${LLM_AUDIO_API_KEY}

  # ── ⑤ tts：CosyVoice (DashScope WebSocket SDK) ──
  # 使用 SpeechSynthesizer WebSocket 协议，直接返回音频字节，无 OSS 下载环节
  # 候选音色：longwan / longxiaochun / longanyang / longxiaobei …（详见 DashScope 文档）
  tts-model: ${LLM_TTS_MODEL:cosyvoice-v3.5-flash}
  tts-api-url: ${LLM_TTS_API_URL:https://dashscope.aliyuncs.com/api/v1}
  tts-api-key: ${LLM_TTS_API_KEY}

# 文件上传路径
file:
  upload-dir: ./uploads

# MCP Server 地址
mcp:
  rag:
    url: http://localhost:8091
  question:
    url: http://localhost:8092
  knowledge:
    url: http://localhost:8093

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# LangChain4j 配置
langchain4j:
  open-ai:
    embedding-model:
      base-url: ${llm.embedding-api-url}
      api-key: ${llm.embedding-api-key}
      model-name: ${llm.embedding-model}
      dimensions: 1536
    chat-model:
      base-url: ${llm.api-url}
      api-key: ${llm.api-key}
      model-name: ${llm.model}
  pgvector:
    host: ${DB_HOST:localhost}
    port: 5432
    database: kaoyan
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    table: langchain_chunks
    dimension: 1536
    create-table: true
    drop-table-first: false

# Agent 工具上下文（MCP 工具需要 session 级 kbIds）
agent:
  tools:
    search-knowledge-base: true
    search-question-bank: true
