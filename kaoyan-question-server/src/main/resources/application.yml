server:
  port: 8092

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/kaoyan
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
