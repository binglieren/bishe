# 考研助手 — Docker Compose 一键部署
# 使用: cp .env.example .env → 编辑 .env → docker-compose up -d
# 前提: 先执行 mvn package -DskipTests 生成各模块 jar

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: kaoyan-db
    environment:
      POSTGRES_DB: kaoyan
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kaoyan-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  host:
    build: ./kaoyan-host
    container_name: kaoyan-host
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kaoyan
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_URL: ${LLM_API_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-pro}
      LLM_EMBEDDING_API_KEY: ${LLM_EMBEDDING_API_KEY}
      LLM_EMBEDDING_API_URL: ${LLM_EMBEDDING_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-v4}
      LLM_MULTIMODAL_API_KEY: ${LLM_MULTIMODAL_API_KEY}
      LLM_MULTIMODAL_API_URL: ${LLM_MULTIMODAL_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MULTIMODAL_MODEL: ${LLM_MULTIMODAL_MODEL:-qwen-vl-ocr}
      LLM_AUDIO_API_KEY: ${LLM_AUDIO_API_KEY}
      LLM_AUDIO_API_URL: ${LLM_AUDIO_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_AUDIO_MODEL: ${LLM_AUDIO_MODEL:-qwen3-omni-flash}
      LLM_TTS_API_KEY: ${LLM_TTS_API_KEY}
      LLM_TTS_API_URL: ${LLM_TTS_API_URL:-https://dashscope.aliyuncs.com/api/v1}
      LLM_TTS_MODEL: ${LLM_TTS_MODEL:-cosyvoice-v3.5-flash}
      FILE_UPLOAD_DIR: ${FILE_UPLOAD_DIR:-./uploads}

volumes:
  pgdata:
  redisdata:
