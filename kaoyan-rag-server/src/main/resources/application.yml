server:
  port: 8091

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/kaoyan
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none

llm:
  embedding:
    api-url: ${LLM_EMBEDDING_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${LLM_EMBEDDING_API_KEY}
    model: ${LLM_EMBEDDING_MODEL:text-embedding-v4}

langchain4j:
  open-ai:
    embedding-model:
      base-url: ${llm.embedding.api-url}
      api-key: ${llm.embedding.api-key}
      model-name: ${llm.embedding.model}
      dimensions: 1536
  pgvector:
    host: ${DB_HOST:localhost}
    port: 5432
    database: kaoyan
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    table: langchain_chunks
    dimension: 1536
    create-table: false
    drop-table-first: false
